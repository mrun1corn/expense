
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);color:var(--color-text-primary)}
.header{padding:1.25rem 0 1rem;border-bottom:0.5px solid var(--color-border-tertiary)}
.title{font-size:18px;font-weight:500;margin-bottom:4px}
.subtitle{font-size:13px;color:var(--color-text-secondary)}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:1rem 0}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 14px;flex:1;min-width:110px}
.stat-n{font-size:22px;font-weight:500;line-height:1}
.stat-l{font-size:11px;color:var(--color-text-secondary);margin-top:3px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:1rem 0}
.controls input,.controls select{flex:1;min-width:140px;font-size:13px}
.type-filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 1rem}
.badge{font-size:11px;padding:3px 9px;border-radius:20px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);transition:all 0.15s}
.badge.active{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}
.region-block{margin-bottom:1.25rem}
.region-head{font-size:13px;font-weight:500;color:var(--color-text-secondary);letter-spacing:.04em;padding:6px 0 8px;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.country-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin-bottom:8px;overflow:hidden}
.country-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none}
.country-head:hover{background:var(--color-background-secondary)}
.flag{font-size:18px;line-height:1}
.country-info{flex:1}
.country-name{font-size:14px;font-weight:500}
.country-cur{font-size:12px;color:var(--color-text-secondary)}
.sys-count{font-size:11px;color:var(--color-text-tertiary);margin-left:auto}
.chevron{font-size:16px;color:var(--color-text-tertiary);transition:transform 0.2s}
.chevron.open{transform:rotate(180deg)}
.systems-list{padding:0 14px 12px;display:none}
.systems-list.open{display:block}
.sys-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.sys-row:last-child{border-bottom:none}
.sys-name{font-size:13px;font-weight:500}
.sys-op{font-size:11px;color:var(--color-text-secondary);margin-top:1px}
.sys-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.type-pill{font-size:10px;padding:2px 7px;border-radius:12px;white-space:nowrap}
.sys-year{font-size:10px;color:var(--color-text-tertiary)}
.no-results{text-align:center;padding:2rem;color:var(--color-text-secondary);font-size:14px}
.regulator{font-size:11px;color:var(--color-text-tertiary);margin-left:auto}
.t-mfs{background:#E1F5EE;color:#0F6E56}.t-rtp{background:#E6F1FB;color:#185FA5}.t-wallet{background:#EEEDFE;color:#534AB7}.t-bank{background:#FAEEDA;color:#854F0B}.t-neo{background:#FAECE7;color:#993C1D}.t-card{background:#EAF3DE;color:#3B6D11}.t-cbdc{background:#FBEAF0;color:#993556}.t-other{background:#F1EFE8;color:#5F5E5A}
@media(prefers-color-scheme:dark){
.t-mfs{background:#085041;color:#9FE1CB}.t-rtp{background:#0C447C;color:#B5D4F4}.t-wallet{background:#3C3489;color:#CECBF6}.t-bank{background:#633806;color:#FAC775}.t-neo{background:#712B13;color:#F5C4B3}.t-card{background:#27500A;color:#C0DD97}.t-cbdc{background:#72243E;color:#F4C0D1}.t-other{background:#444441;color:#D3D1C7}}
</style>

const FLAGS = {BD:'🇧🇩',IN:'🇮🇳',PK:'🇵🇰',NP:'🇳🇵',LK:'🇱🇰',CN:'🇨🇳',JP:'🇯🇵',KR:'🇰🇷',PH:'🇵🇭',ID:'🇮🇩',MY:'🇲🇾',TH:'🇹🇭',VN:'🇻🇳',MM:'🇲🇲',KH:'🇰🇭',SG:'🇸🇬',HK:'🇭🇰',TW:'🇹🇼',KE:'🇰🇪',TZ:'🇹🇿',UG:'🇺🇬',RW:'🇷🇼',GH:'🇬🇭',NG:'🇳🇬',ZA:'🇿🇦',ET:'🇪🇹',EG:'🇪🇬',ZM:'🇿🇲',ZW:'🇿🇼',MZ:'🇲🇿',CD:'🇨🇩',CI:'🇨🇮',SN:'🇸🇳',CM:'🇨🇲',MG:'🇲🇬',MW:'🇲🇼',TG:'🇹🇬',SA:'🇸🇦',AE:'🇦🇪',JO:'🇯🇴',IQ:'🇮🇶',BH:'🇧🇭',TR:'🇹🇷',KZ:'🇰🇿',UZ:'🇺🇿',GB:'🇬🇧',SE:'🇸🇪',NO:'🇳🇴',DK:'🇩🇰',NL:'🇳🇱',PL:'🇵🇱',RU:'🇷🇺',UA:'🇺🇦',US:'🇺🇸',BR:'🇧🇷',MX:'🇲🇽',AR:'🇦🇷',CO:'🇨🇴',PE:'🇵🇪',CL:'🇨🇱',SV:'🇸🇻',JM:'🇯🇲',AU:'🇦🇺',NZ:'🇳🇿',ZZ:'🌍'};

const TYPE_CLASS = {
  'MFS':'t-mfs','Real-Time Payment Rail':'t-rtp','Banking Rail':'t-bank',
  'Digital Wallet':'t-wallet','Neobank':'t-neo','Card Network':'t-card','CBDC':'t-cbdc'
};
function getTypeClass(type){
  for(const k of Object.keys(TYPE_CLASS)) if(type.includes(k)) return TYPE_CLASS[k];
  return 't-other';
}

let activeTypes = new Set();
let activeRegion = '';

const regionSel = document.getElementById('regionFilter');
DATA.regions.forEach(r=>{
  const opt = document.createElement('option');
  opt.value = r.region; opt.textContent = r.region;
  regionSel.appendChild(opt);
});

const allTypes = new Set();
DATA.regions.forEach(r=>r.countries.forEach(c=>c.systems.forEach(s=>{
  for(const k of Object.keys(TYPE_CLASS)) if(s.type.includes(k)){allTypes.add(k);break;}
  if(![...Object.keys(TYPE_CLASS)].some(k=>s.type.includes(k))) allTypes.add('Other');
})));

const typeFilters = document.getElementById('typeFilters');
const typeLabels = {'MFS':'MFS / Mobile Money','Real-Time Payment Rail':'Real-Time Payment Rail','Banking Rail':'Banking Infrastructure','Digital Wallet':'Digital Wallet','Neobank':'Neobank','Card Network':'Card Network','CBDC':'CBDC'};
[...Object.keys(TYPE_CLASS)].forEach(t=>{
  const b = document.createElement('span');
  b.className='badge'; b.textContent = typeLabels[t]||t; b.dataset.type=t;
  b.onclick=()=>{
    if(activeTypes.has(t)) activeTypes.delete(t); else activeTypes.add(t);
    b.classList.toggle('active', activeTypes.has(t));
    render();
  };
  typeFilters.appendChild(b);
});

function matches(sys, q){
  if(!q) return true;
  const l = q.toLowerCase();
  return sys.name.toLowerCase().includes(l)||sys.operator.toLowerCase().includes(l)||sys.category.toLowerCase().includes(l)||(sys.type||'').toLowerCase().includes(l);
}
function matchesCountry(c, q){
  if(!q) return true;
  const l = q.toLowerCase();
  return c.country.toLowerCase().includes(l)||c.currency_code.toLowerCase().includes(l)||c.currency.toLowerCase().includes(l);
}

const open = {};

function render(){
  const q = document.getElementById('search').value;
  const reg = document.getElementById('regionFilter').value;
  const res = document.getElementById('results');
  let html = '';
  let totalShown = 0;

  DATA.regions.forEach((region,ri)=>{
    if(reg && reg !== region.region) return;
    let regionHtml = '';
    let regionCount = 0;
    region.countries.forEach((c,ci)=>{
      const key = region.region+'|'+c.country_code;
      let filteredSys = c.systems.filter(s=>{
        const typeOk = activeTypes.size===0 || [...activeTypes].some(t=>s.type.includes(t));
        return typeOk && (matches(s,q) || matchesCountry(c,q));
      });
      if(!filteredSys.length) return;
      regionCount += filteredSys.length;
      totalShown += filteredSys.length;
      const isOpen = open[key];
      let sysHtml = '';
      filteredSys.forEach(s=>{
        const cls = getTypeClass(s.type);
        sysHtml += `<div class="sys-row">
          <div><div class="sys-name">${s.name}</div><div class="sys-op">${s.operator}</div></div>
          <div class="sys-meta">
            <span class="type-pill ${cls}">${s.type}</span>
            <span class="sys-year">${s.launched||''}</span>
          </div>
        </div>`;
      });
      regionHtml += `<div class="country-card">
        <div class="country-head" onclick="toggleCard('${key}')">
          <span class="flag">${FLAGS[c.country_code]||'🌐'}</span>
          <div class="country-info">
            <div class="country-name">${c.country}</div>
            <div class="country-cur">${c.currency_symbol} ${c.currency_code} — ${c.currency}</div>
          </div>
          <span class="sys-count">${filteredSys.length} system${filteredSys.length!==1?'s':''}</span>
          <i class="ti ti-chevron-down chevron ${isOpen?'open':''}" aria-hidden="true"></i>
        </div>
        <div class="systems-list ${isOpen?'open':''}">
          <div style="font-size:11px;color:var(--color-text-tertiary);margin-bottom:8px">Regulator: ${c.regulator}</div>
          ${sysHtml}
        </div>
      </div>`;
    });
    if(!regionHtml) return;
    html += `<div class="region-block">
      <div class="region-head"><span>${region.region}</span><span style="font-size:11px">${regionCount} systems</span></div>
      ${regionHtml}
    </div>`;
  });

  if(!html) html = '<div class="no-results"><i class="ti ti-search" style="font-size:24px;display:block;margin-bottom:8px" aria-hidden="true"></i>No systems match your filters.</div>';

  const s = document.getElementById('stats');
  s.children[0].querySelector('.stat-n').textContent = totalShown;
  res.innerHTML = html;
}

window.toggleCard = function(key){
  open[key] = !open[key];
  render();
};

document.getElementById('search').addEventListener('input', render);
document.getElementById('regionFilter').addEventListener('change', e=>{activeRegion=e.target.value; render();});

render();
</script>
